[project]
name = "a2a-capability-team"
version = "0.1.0"
description = "Autonomous tool-calling manager and three Ollama agents negotiating capabilities over A2A"
requires-python = ">=3.12"
dependencies = [
  "a2a-sdk[http-server]==0.3.0",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]
